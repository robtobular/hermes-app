    let activeTeam = 'gophers';

    function switchTeam(team) {
      activeTeam = team;
      const gBtn = document.getElementById('tab-gophers');
      const oBtn = document.getElementById('tab-opp');

      if (team === 'gophers') {
        gBtn.className = "py-2 rounded-xl font-neutra text-xs uppercase tracking-wider transition-all duration-200 bg-[#7A0019] text-[#FFCC33] border-2 border-[#FFCC33] shadow text-center";
        oBtn.className = "py-2 rounded-xl font-neutra text-xs uppercase tracking-wider transition-all duration-200 bg-slate-800 text-slate-300 border border-slate-700 text-center";
      } else {
        oBtn.className = "py-2 rounded-xl font-neutra text-xs uppercase tracking-wider transition-all duration-200 bg-sky-900 text-white border-2 border-sky-400 shadow text-center";
        gBtn.className = "py-2 rounded-xl font-neutra text-xs uppercase tracking-wider transition-all duration-200 bg-slate-800 text-slate-300 border border-slate-700 text-center";
      }
      filterRoster();
    }

    function filterRoster() {
      const query = document.getElementById('player-search').value.toLowerCase().trim();
      const list = activeTeam === 'gophers' ? gophersData : oppData;
      const container = document.getElementById('roster-container');

      const filtered = list.filter(p => {
        if (!query) return true;
        const searchStr = `${p.jersey} ${p.name} ${p.pos} ${p.ht} ${p.yr} ${p.hometown} ${p.hs || ''} ${p.transfer_from || ''}`.toLowerCase();
        return searchStr.includes(query);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="gopher-card rounded-xl p-6 text-center text-slate-500 text-xs">No players found matching "${query}"</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        let badgesHtml = '';
        if (p.is_mn) {
          badgesHtml += `<span class="px-1.5 py-0.5 rounded bg-[#7A0019]/60 text-amber-300 text-[9px] font-bold border border-[#FFCC33]/40 inline-flex items-center gap-0.5"><i class="fa-solid fa-tree"></i> MN Native</span> `;
        }
        if (p.transfer_from) {
          badgesHtml += `<span class="px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 text-[9px] font-bold border border-blue-500/40 inline-flex items-center gap-0.5"><i class="fa-solid fa-right-left"></i> ${p.transfer_from}</span> `;
        }

        let originLine = p.hometown;
        if (p.hs) {
          originLine += ` • <span class="text-amber-400 font-semibold">${p.hs}</span>`;
        }

        let avatarHtml = '';
        if (p.headshot && p.headshot !== 'None' && !p.headshot.includes('nothumb')) {
          avatarHtml = `<img src="${p.headshot}" alt="${p.name}" class="w-9 h-9 rounded-full object-cover bg-slate-800 border border-slate-700 flex-shrink-0" onerror="this.outerHTML='<div class=\'w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-neutra text-xs text-[#FFCC33] flex-shrink-0\'>#${p.jersey}</div>'">`;
        } else {
          avatarHtml = `<div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-neutra text-xs text-[#FFCC33] flex-shrink-0">#${p.jersey}</div>`;
        }

        return `
          <div class="gopher-card rounded-xl p-2.5 flex items-center justify-between gap-2.5 hover:border-slate-600 transition-colors">
            
            <!-- Left: Jersey + Photo + Name/Badges -->
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="font-neutra text-sm text-[#FFCC33] w-5 text-center flex-shrink-0">${p.jersey}</div>
              ${avatarHtml}
              <div class="min-w-0">
                <div class="font-bold text-white text-xs md:text-sm truncate leading-snug">
                  ${p.name}
                  <span class="text-[10px] font-bold text-slate-400 ml-1">(${p.pos})</span>
                </div>
                <div class="text-[10px] text-slate-400 truncate mt-0.5">
                  ${originLine}
                </div>
                ${badgesHtml ? `<div class="flex flex-wrap gap-1 mt-1">${badgesHtml}</div>` : ''}
              </div>
            </div>

            <!-- Right: Height / Weight / Year Stats Pill -->
            <div class="text-right flex-shrink-0 pl-1 border-l border-white/5">
              <div class="text-xs font-bold text-slate-200">${p.ht}</div>
              <div class="text-[10px] text-slate-400">${p.wt} • ${p.yr}</div>
            </div>

          </div>
        `;
      }).join('');
    }

    // Init on load
    filterRoster();
  </script>
</body>
</html>
